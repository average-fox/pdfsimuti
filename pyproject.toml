[project]
name = "pdfsimuti"
version = "0.3.0"
description = ""
requires-python = ">=3.10"

keywords = [
    "PDF",
    "Compression",
    "Merging",
    "CLI",
    "Utility",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pymupdf>=1.24.12,<2",
    "typer==0.21.2",
]

[project.urls]
repository = "https://github.com/average-fox/pdfsimuti"
"Bug Tracker" = "https://github.com/average-fox/pdfsimuti/issues"

[project.scripts]
pdfsimuti = "pdfsimuti.main:app"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
