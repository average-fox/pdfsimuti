[tool.poetry]
name = "pdfsimuti"
version = "0.2.5"
description = ""
authors = ["foxtbirdy <foxtbird7@gmail.com>"]
readme = "README.md"
packages = [{include = "pdfsimuti", from = "src"}]

[tool.poetry.dependencies]
