[project]
requires-python = ">=3.5"
keywords = ["PDF", "Compression", "Merging", "CLI", "Utility"]

[project.urls]
repository = "https://github.com/foxtbirdy/pdfsimuti"
"Bug Tracker" = "https://github.com/foxtbirdy/pdfsimuti/issues"

[tool.poetry]
name = "pdfsimuti"
version = "0.3.0"
description = ""
authors = [
    { name = "Ahnaf Tahmid (foxtbirdy)", email = "foxtbird7@gmail.com}
]
packages = [{include = "pdfsimuti", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13.0"
python-magic = {version = "^0.4.27", platform = "linux"}
python-magic-bin = {version = "^0.4.14", platform = "win32"}
pymupdf = "^1.24.12"
typer = "^0.12.5"

[tool.poetry.scripts]
pdfsimuti= "pdfsimuti.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
